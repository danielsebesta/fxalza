<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" role="img" aria-label="Animace: v odkazu na Alzu přibude fx před alza.cz a Discord ukáže kartu s cenou, slevami a kupóny">
<style>
text{font-family:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
