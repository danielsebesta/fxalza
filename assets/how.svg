@keyframes ph{0%,36%{opacity:0}38%,94%{opacity:1}96%,100%{opacity:0}}
@keyframes msg{0%,38%{opacity:0;transform:translateY(12px)}44%,93%{opacity:1;transform:none}97%,100%{opacity:0;transform:none}}
@keyframes card{0%,44%{opacity:0;transform:translateY(10px)}53%,93%{opacity:1;transform:none}97%,100%{opacity:0;transform:none}}
@keyframes c1{0%{opacity:1}12%{opacity:1}15%,100%{opacity:0}}
@keyframes c2{0%,12%{opacity:0}16%,34%{opacity:1}38%,100%{opacity:0}}
@keyframes c3{0%,40%{opacity:0}46%,93%{opacity:1}97%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

