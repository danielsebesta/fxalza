#typed{opacity:0;animation:typed 12s infinite}
#fx{font-size:16px;fill:#2f93f0;animation:fx 12s infinite}
#ph{animation:ph 12s infinite}
#old{opacity:0;animation:old 12s infinite}
#msg{animation:msg 12s infinite}
#card{animation:card 12s infinite}
#c1{opacity:0;animation:c1 12s infinite}
#c2{opacity:0;animation:c2 12s infinite}
#c3{animation:c3 12s infinite}
@keyframes typed{0%{opacity:1}36%{opacity:1}37%{opacity:0}96%{opacity:0}100%{opacity:1}}
@keyframes fx{0%,14%{font-size:0;opacity:0}19%,96%{font-size:16px;opacity:1}97%,100%{font-size:0;opacity:0}}
